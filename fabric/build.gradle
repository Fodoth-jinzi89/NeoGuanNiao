architectury { platformSetupLoomIde(); fabric() }
sourceSets {
    finalJarRun
}
sourceSets.main.resources.srcDir project(':common').sourceSets.main.resources.srcDirs
loom {
    mods.clear()
    runs.configureEach {
        source sourceSets.finalJarRun
        property 'fabric.addMods', tasks.named('remapJar').get().archiveFile.get().asFile.absolutePath
    }
}
tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
tasks.named('sourcesJar') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
tasks.named('jar') {
    dependsOn(':common:transformProductionFabric')
    from({ zipTree(project(':common').layout.buildDirectory.file('libs/common-' + rootProject.mod_version + '-transformProductionFabric.jar').get().asFile) }) {
        exclude 'META-INF/**'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    // libs/compileOnly 里都是 Fabric 模组包（intermediary 映射），需要 modCompileOnly 让 Loom 重映射成 named 才能编译。
    modCompileOnly fileTree(dir: 'libs/compileOnly', include: ['*.jar'],
            exclude: ['jei-*.jar', 'moonlight-*.jar', 'spectrum-*.jar', 'supplementaries-*.jar'])
    // 下面三个包由更新的 Loom 构建（moonlight/supplementaries 1.17.20、spectrum 1.11.8），本仓库的 Loom 1.10.455
    // 在配置期直接拒绝加载（"Mod was built with a newer version of Loom"），无法重映射；仅作参考，源码未引用。
    compileOnly fileTree(dir: 'libs/compileOnly', include: ['moonlight-*.jar', 'spectrum-*.jar', 'supplementaries-*.jar'])
    // JEI 的 Fabric 包同理由更新的 Loom（1.13.6）构建而无法重映射。两个平台的 JEI API 类完全一致，
    // 所以编译期借用 NeoForge 包，运行时由 Fabric 的 JEI 提供。
    compileOnly fileTree(dir: '../neoforge/libs/compileOnly', include: ['jei-*.jar'])
    runtimeOnly fileTree(dir: 'libs/runtimeOnly', include: ['*.jar'])
    modImplementation fileTree(dir: 'libs/implementation', include: ['*.jar'])
    implementation project(path: ':common')
}
sourceSets.finalJarRun.runtimeClasspath = files(
        configurations.runtimeClasspath.filter { !it.toPath().startsWith(project(':common').layout.buildDirectory.get().asFile.toPath()) }
)
tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    dependsOn tasks.named('remapJar')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
